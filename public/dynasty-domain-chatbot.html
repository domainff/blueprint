<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty Domain â Ask Anything</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a1628;
    --navy-mid: #0f1f3d;
    --navy-light: #162a52;
    --gold: #ff4200;
    --gold-light: #ea9a19;
    --white: #f0f4ff;
    --muted: #8a9bc0;
    --accent: #4a9eff;
    --green: #00e676;
    --surface: #111e38;
    --border: rgba(255,66,0,0.15);
    --radius: 12px;
  }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,66,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(74,158,255,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    background: rgba(10,22,40,0.8);
    backdrop-filter: blur(12px);
  }

  .logo {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(255,66,0,0.3);
    overflow: hidden;
    background: transparent;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .header-text h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    line-height: 1;
    color: var(--white);
  }

  .header-text p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 400;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 4px; }

  /* Messages */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 14px;
  }

  .avatar.bot {
    background: transparent;
    box-shadow: 0 0 12px rgba(255,66,0,0.25);
    overflow: hidden;
    padding: 2px;
  }

  .avatar.bot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .avatar.user-av {
    background: var(--navy-light);
    color: var(--gold);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.6;
    font-weight: 400;
  }

  .message.bot .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--white);
    border-top-left-radius: 3px;
  }

  .message.user .bubble {
    background: var(--navy-light);
    border: 1px solid rgba(74,158,255,0.2);
    color: var(--white);
    border-top-right-radius: 3px;
    text-align: right;
  }

  .bubble strong {
    color: var(--gold-light);
    font-weight: 600;
  }

  .bubble a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(74,158,255,0.3);
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 16px 18px;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Quick questions */
  .quick-questions {
    padding: 0 24px 12px;
    flex-shrink: 0;
  }

  .quick-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .quick-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Barlow', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .quick-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(245,166,35,0.05);
  }

  /* Input area */
  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: rgba(10,22,40,0.8);
    backdrop-filter: blur(12px);
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .input-wrapper {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(245,166,35,0.4);
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    resize: none;
    line-height: 1.5;
    max-height: 120px;
    min-height: 24px;
  }

  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 48px;
    height: 48px;
    background: var(--gold);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(255,66,0,0.2);
  }

  .send-btn:hover:not(:disabled) {
    background: var(--gold-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(255,66,0,0.35);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .send-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--navy);
  }

  .upload-btn {
    width: 48px;
    height: 48px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .upload-btn:hover {
    border-color: var(--gold);
    background: rgba(245,166,35,0.05);
  }

  .upload-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--muted);
    transition: fill 0.2s;
  }

  .upload-btn:hover svg { fill: var(--gold); }

  #fileInput { display: none; }

  .image-preview {
    margin-top: 8px;
    position: relative;
    display: inline-block;
  }

  .image-preview img {
    max-height: 80px;
    max-width: 200px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }

  .remove-img {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    background: var(--gold);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--navy);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .msg-image {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    display: block;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    opacity: 0.6;
  }

  .footer-note a { color: var(--gold); text-decoration: none; }

  /* Welcome state */
  .welcome {
    text-align: center;
    padding: 40px 24px;
    animation: fadeUp 0.5s ease;
  }

  .welcome-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(255,66,0,0.3);
    overflow: hidden;
    background: transparent;
  }

  .welcome-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .welcome h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .welcome p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 440px;
    margin: 0 auto;
  }
</style>
</head>

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
}

function showTyping() {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = 'DD';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if ((!text && !pendingImageBase64) || isLoading) return;

  hideWelcome();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  const imageDataUrl = pendingImageBase64 ? `data:${pendingImageType};base64,${pendingImageBase64}` : null;
  const imageBase64 = pendingImageBase64;
  const imageType = pendingImageType;

  input.value = '';
  input.style.height = 'auto';
  clearImage();

  const displayText = text || 'Here is a screenshot of my account page.';
  appendMessage('user', displayText, imageDataUrl);

  // Build message content for API
  let userContent;
  if (imageBase64) {
    userContent = [
      { type: 'image', source: { type: 'base64', media_type: imageType, data: imageBase64 } },
      { type: 'text', text: text || 'Here is a screenshot of my Flock account page. Can you help me troubleshoot?' }
    ];
  } else {
    userContent = text;
  }

  messages.push({ role: 'user', content: userContent });
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': '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', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.[0]?.text || "Sorry, I had trouble with that. Try opening a ticket at https://discord.gg/6hcUy6Hrcu for help.";
    messages.push({ role: 'assistant', content: reply });
    appendMessage('bot', reply);

  } catch (err) {
    removeTyping();
    appendMessage('bot', "Something went wrong. Please open a ticket at https://discord.gg/6hcUy6Hrcu and the team will help you out.");
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}
